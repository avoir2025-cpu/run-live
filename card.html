<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#111214">

<title>完賽圖卡｜跑團 LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="ui.css?v=11">
<style>
body{min-block-size:100dvh}
.chead{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
  padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));min-block-size:calc(var(--top-h) + env(safe-area-inset-top,0px))}
.chead a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-block-size:var(--target);padding:0 8px;font-weight:600}
.chead h1{font-size:17px;flex:1;text-align:center;margin-right:64px}
.cwrap{max-inline-size:980px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 100px) max(14px,env(safe-area-inset-left,0px))}
.cgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.cgrid>*{min-inline-size:0}
@media (min-width:760px){.cgrid{grid-template-columns:minmax(0,360px) 1fr;align-items:start}.pv{position:sticky;top:70px}}
.pv{position:relative;max-inline-size:min(360px,31dvh);margin-inline:auto;inline-size:100%}
@media (min-width:760px){.pv{max-inline-size:360px}}
.pv canvas{display:block;inline-size:100%;block-size:auto;aspect-ratio:var(--ar,9/16);border-radius:16px;box-shadow:0 10px 30px #0003;touch-action:none;background:#2a2b2f;cursor:grab}
.pv .pick{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:16px;color:#fff;cursor:pointer;background:#111214d9;text-align:center;padding:10px}
.pv .pick svg{inline-size:40px;block-size:40px}
.pv .pick b{font-size:16px}
.pv .pick span{font-size:13px;opacity:.8}
.pv input[type=file]{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}
.pv-tools{display:flex;align-items:center;gap:10px;margin-top:10px}
.pv-tools input[type=range]{flex:1;min-block-size:var(--target);accent-color:var(--ink)}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.box h2{font-size:15px;margin-bottom:4px}
input.timein{font-family:var(--num);font-size:34px;font-weight:700;letter-spacing:.03em;min-block-size:60px!important;text-align:center}
.src{font-size:13px;margin:8px 0 0;display:flex;gap:6px;align-items:flex-start}
.src.warnc{color:#9a5b00}.src.okc{color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-block-size:40px;font-weight:700;font-size:14px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw label{inline-size:44px;block-size:44px;border-radius:50%;background:var(--c);cursor:pointer;box-shadow:0 0 0 2px #fff,0 0 0 3px #d8d6d0}
.sw label:has(input:checked){box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.sw input{position:absolute;opacity:0;pointer-events:none}
details.more summary{cursor:pointer;font-weight:700;font-size:15px;min-block-size:var(--target);display:flex;align-items:center}
.savebar{position:fixed;z-index:30;inset:auto 0 0 0;background:#fffffff2;backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-left,0px))}
.savebar .btn{max-inline-size:520px;margin:0 auto}
.dlg img{inline-size:100%;border-radius:12px;display:block;margin-bottom:12px}
</style>
</head>
<body>
<header class="chead"><a id="back" href="./">‹ 地圖</a><h1>完賽圖卡</h1></header>
<div class="cwrap">
  <div class="cgrid">
    <div>
      <div class="pv">
        <canvas id="cv" width="1080" height="1920" role="img" aria-label="完賽圖卡預覽"></canvas>
        <label class="pick" id="pick"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6l1.5-2.5h4L15.5 6"/></svg><b>選一張完賽照片</b><span>直式照片效果最好</span><input id="in-photo" type="file" accept="image/*"></label>
      </div>
      <div class="pv-tools" id="pv-tools" hidden>
        <label class="btn ghost sm" for="in-photo2">換照片</label><input id="in-photo2" type="file" accept="image/*" hidden>
        <input id="in-zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="照片縮放">
      </div>
      <p class="note" id="drag-hint" style="text-align:center;margin-top:6px" hidden>拖曳照片調位置，兩指或滑桿縮放</p>
    </div>

    <div>
      <section class="box">
        <h2>完賽時間</h2>
        <input id="in-time" class="timein" type="text" inputmode="numeric" placeholder="0:00:00" aria-label="完賽時間（時:分:秒）" aria-describedby="time-src">
        <p class="src" id="time-src"></p>
        <button type="button" class="btn dark block" id="btn-sync" style="margin-top:10px" hidden>存成我的正式成績</button>
      </section>

      <section class="box">
        <h2 style="margin-bottom:10px">尺寸</h2>
        <div class="chips" id="fmts"><button type="button" data-fmt="story" aria-pressed="true">限動 9:16</button><button type="button" data-fmt="post" aria-pressed="false">貼文 4:5</button></div>
        <label class="check" id="route-row" style="display:flex;align-items:center;gap:8px;margin-top:10px;min-block-size:var(--target)" hidden><input id="in-route" type="checkbox" checked style="inline-size:20px;block-size:20px;accent-color:var(--ink)"> 附上路線</label>
      </section>

      <section class="box">
        <h2>組別</h2>
        <div class="chips" id="titles"></div>
        <input id="in-title-custom" type="text" maxlength="28" placeholder="輸入自己的標題" style="margin-top:8px" hidden>
      </section>

      <section class="box">
        <div class="grid2" style="grid-template-columns:1fr 34%">
          <div class="field" style="margin:0"><label for="in-name">名字</label><input id="in-name" type="text" maxlength="12"></div>
          <div class="field" style="margin:0"><label for="in-bib">號碼</label><input id="in-bib" type="text" maxlength="8" inputmode="numeric"></div>
        </div>
        <div class="field" style="margin-bottom:0"><label for="in-sub">第二行（英文名，選填）</label><input id="in-sub" type="text" maxlength="24" autocapitalize="characters"></div>
      </section>

      <section class="box">
        <h2 style="margin-bottom:10px">重點色</h2>
        <div class="sw" id="sw"></div>
        <details class="more" style="margin-top:10px"><summary>更多文字（賽事名稱、英文小字、hashtag）</summary>
          <div class="field"><label for="in-team">賽事名稱</label><input id="in-team" type="text" maxlength="16"></div>
          <div class="field"><label for="in-event">賽事名稱上面的英文小字</label><input id="in-event" type="text" maxlength="34" autocapitalize="characters"></div>
          <div class="field" style="margin-bottom:0"><label for="in-tag">hashtag（選填，放在右下角）</label><input id="in-tag" type="text" maxlength="16" placeholder="#一起跑到終點"></div>
        </details>
      </section>
    </div>
  </div>
</div>
<div class="savebar"><button type="button" class="btn primary block lg" id="btn-save">儲存圖片</button></div>

<dialog id="dlg" class="dlg">
  <img id="dlg-img" alt="完成的完賽圖卡">
  <p style="margin:0 0 12px;font-size:15px">長按圖片，選「儲存影像」或「加入照片」。</p>
  <div class="row-end"><button type="button" class="btn dark" id="dlg-close">好</button></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { CAT, analyze, loadRoutes, fmtHMS, parseHMS, bindTimeInput } from './calc.js?v=10';
import { SB_URL, SB_KEY } from './config.js';

/* ====== 版型設定 v3（11/28 研究 NRC／Strava 分享卡、跑團品牌後重做） ======
   原則：成績當主角（窄體粗斜大字撐滿寬）、整張只用一套窄體字＋思源黑體、靠左對齊、Strava 式數據列（配速/距離/日期）、只用一個重點色。
   座標以寬 1080 為準。story＝IG 限動 9:16（上方約 250px、下方約 250px 會被 IG 介面擋住）；post＝貼文 4:5。 */
const FORMATS = { story: { W: 1080, H: 1920, top: 250, bot: 250 }, post: { W: 1080, H: 1350, top: 76, bot: 66 } };
const COND = '"Barlow Condensed", "Arial Narrow", sans-serif', ZH = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const BRAND = [['CHUN EN', '形象美學'], ['CAINERGY', '采能行銷']]; // 左下固定品牌小字（不給改）
const THEMES = { red: '#ff2d3d', volt: '#d4ff3a', orange: '#ff7a1a', sky: '#38c6ff', white: '#ffffff' };
const THEME_NAMES = { red: '紅', volt: '螢光黃', orange: '橘', sky: '天藍', white: '白' };
const TITLES = ['FULL MARATHON FINISHER', 'HALF MARATHON FINISHER', '10K FINISHER', '5K FINISHER', 'PERSONAL BEST', 'FIRST MARATHON'];
const DIST = { full: 42.195, half: 21.0975, '10k': 10, '5k': 5, '12k': 12, '3k5': 3.5, '3k': 3 };

let lastEv = null; try { lastEv = JSON.parse(localStorage.getItem('rl__last')); } catch { }
const TEAM = new URLSearchParams(location.search).get('t') || lastEv || 'tc2026';
const K = k => `rl_${TEAM}_${k}`;
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(K(k))); } catch { return null; } }, set(k, v) { try { localStorage.setItem(K(k), JSON.stringify(v)); } catch { } } };
const $ = s => document.querySelector(s);
$('#back').href = `./?t=${encodeURIComponent(TEAM)}`;
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3000); };
async function rpc(fn, args) {
  const r = await fetch(SB_URL + fn, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  const j = await r.json().catch(() => null); if (!r.ok) { const e = new Error(j?.message || r.status); e.code = j?.message; throw e; } return j;
}

// ---------- 預設值 ----------
const old = ls.get('card2') || ls.get('card') || {}, saved = ls.get('card3') || { name: old.name, bib: old.bib, sub: old.sub, title: old.title, time: old.time, fmt: old.fmt };
let me = ls.get('me');
let gcode = null; try { gcode = JSON.parse(localStorage.getItem('rl__code')); } catch { }
const token = ls.get('token'), code = ls.get('code') || gcode;
const titleByCat = { full: TITLES[0], half: TITLES[1], '10k': TITLES[2], '5k': TITLES[3], '12k': '12K FINISHER', '3k5': '3.5K FINISHER', '3k': '3K FINISHER' };
// 12K／3.5K／3K 的稱號放進可選清單第三格（不然會被當成自己打的字）
if (me?.cat && titleByCat[me.cat] && !TITLES.includes(titleByCat[me.cat])) TITLES.splice(2, 0, titleByCat[me.cat]);
const F = {
  name: saved.name ?? me?.nick ?? '', bib: saved.bib ?? me?.bib ?? '', sub: saved.sub ?? '',
  title: saved.title ?? titleByCat[me?.cat] ?? TITLES[0],
  team: saved.team ?? '', event: saved.event ?? '', tag: saved.tag ?? '', fmt: saved.fmt === 'post' ? 'post' : 'story',
  theme: THEMES[saved.theme] ? saved.theme : 'red', time: '',
};
for (const k of ['name', 'bib', 'sub', 'team', 'event', 'tag']) $(`#in-${k}`).value = F[k] || '';
const isCustom = !TITLES.includes(F.title);
$('#titles').innerHTML = TITLES.map(t => `<button type="button" data-title="${t}" aria-pressed="${t === F.title}">${t}</button>`).join('') + `<button type="button" data-title="__custom" aria-pressed="${isCustom}">自己打</button>`;
if (isCustom) { $('#in-title-custom').hidden = false; $('#in-title-custom').value = F.title; }
$('#sw').innerHTML = Object.entries(THEMES).map(([k, c]) => `<label style="--c:${c}"><input type="radio" name="theme" value="${k}" ${k === F.theme ? 'checked' : ''} aria-label="${THEME_NAMES[k]}"></label>`).join('');

// ---------- 完賽時間來源 ----------
let gpsSec = null;
function setSrc() {
  const v = parseHMS($('#in-time').value), el = $('#time-src');
  const official = me?.finish_sec;
  if (official && v === official) { el.className = 'src okc'; el.textContent = '✓ 這是你登記的大會正式成績'; }
  else if (!v) { el.className = 'src'; el.textContent = '直接打數字，冒號會自動加上。例如 4 小時 12 分 33 秒，打 41233'; }
  else if (gpsSec && v === gpsSec) { el.className = 'src warnc'; el.textContent = '⚠ 這是 GPS 估計的時間，請改成大會正式成績'; }
  else { el.className = 'src'; el.textContent = official ? `你登記的正式成績是 ${fmtHMS(official)}` : '這個時間還沒存成你的正式成績'; }
  $('#btn-sync').hidden = !(token && v && v !== official);
}
function setTime(sec) { if (!sec) return; $('#in-time').value = fmtHMS(sec); readForm(); }
if (me?.finish_sec) setTime(me.finish_sec);
else if (saved.time) $('#in-time').value = saved.time;
setSrc();
// 賽事名稱、英文小字從賽事清單帶（自己改過就不蓋）；日期每次都拿，給數據列用
let evDate = '';
rpc('runlive_events', {}).then(evs => {
  const e = (evs || []).find(x => x.slug === TEAM); if (!e) return;
  evDate = (e.date || '').replace(/-/g, '.');
  if (saved.team == null && !$('#in-team').value) $('#in-team').value = e.name.replace(/[（(].*$/, '').trim();
  if (saved.event == null && !$('#in-event').value) $('#in-event').value = e.en || (e.date || '').slice(0, 4);
  readForm(); redraw();
}).catch(() => { });
// 路線：大會路線（routes/場次.json，有 GPX 的組別）；沒有就用自己當天回報的 GPS 軌跡
let routeJson = null, myTrack = null;
fetch(`routes/${encodeURIComponent(TEAM)}.json?v=1`).then(r => r.ok ? r.json() : null).then(j => { routeJson = j; redraw(); }).catch(() => { });
if (token) {
  rpc('runlive_me', { p_token: token }).then(async m => {
    me = m; ls.set('me', m);
    if (!$('#in-name').value) $('#in-name').value = m.nick;
    if (!$('#in-bib').value && m.bib) $('#in-bib').value = m.bib;
    if (m.finish_sec && !saved.time) setTime(m.finish_sec);
    if (code) {
      try {
        const st = await rpc('runlive_state', { p_team: TEAM, p_code: code, p_since: null });
        const mine = st.points.filter(p => p.r === m.id).sort((a, b) => a.t - b.t);
        if (mine.length >= 10) myTrack = mine.map(p => [p.la, p.lo]);
        if (!m.finish_sec) {
          await loadRoutes(TEAM, st.team?.config?.routes);
          const r = st.runners.find(x => x.id === m.id);
          const a = analyze(r, mine, st.team.config, Date.now());
          if (a.status === 'finished') { gpsSec = a.finishSec; if (!$('#in-time').value) setTime(gpsSec); }
        }
      } catch { }
    }
    readForm(); setSrc(); redraw();
  }).catch(() => { });
}

// ---------- 照片 ----------
const photo = { img: null, x: 0, y: 0, z: 1 };
function loadPhoto(f) {
  if (!f) return;
  const img = new Image();
  img.onload = () => { photo.img = img; photo.x = 0; photo.y = 0; photo.z = 1; $('#in-zoom').value = 1; $('#pick').hidden = true; $('#pv-tools').hidden = false; $('#drag-hint').hidden = false; draw(); };
  img.onerror = () => toast('這張照片讀不出來，換一張試試');
  img.src = URL.createObjectURL(f);
}
$('#in-photo').onchange = ev => loadPhoto(ev.target.files[0]);
$('#in-photo2').onchange = ev => loadPhoto(ev.target.files[0]);
$('#in-zoom').oninput = ev => { photo.z = +ev.target.value; draw(); };
const cv = $('#cv'), ctx = cv.getContext('2d');
const ptrs = new Map(); let pinch0 = null;
const scale = () => cv.width / cv.getBoundingClientRect().width;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), z: photo.z }; } });
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p || !photo.img) return;
  if (ptrs.size === 1) { photo.x += (e.clientX - p.x) * scale(); photo.y += (e.clientY - p.y) * scale(); }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; photo.z = Math.max(1, Math.min(3, pinch0.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d)); $('#in-zoom').value = photo.z; }
  draw();
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

// ---------- 繪圖 ----------
// 字距：canvas 的 letterSpacing 舊 Safari 不支援，一個字一個字畫
function spaced(t, x, y, sp, align = 'left') {
  const ch = [...t], ws = ch.map(c => ctx.measureText(c).width), w = ws.reduce((a, b) => a + b, 0) + sp * Math.max(0, ch.length - 1);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const a0 = ctx.textAlign; ctx.textAlign = 'left';
  ch.forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + sp; });
  ctx.textAlign = a0; return w;
}
const spacedW = (t, sp) => [...t].reduce((a, c) => a + ctx.measureText(c).width, 0) + sp * Math.max(0, [...t].length - 1);
// 字太長就縮：fits(size) 回 true 才停
function fitFont(css, size, min, fits) { ctx.font = css(size); while (!fits(size) && size > min) { size -= 2; ctx.font = css(size); } return size; }
function sizeCanvas() {
  const f = FORMATS[F.fmt]; if (cv.width !== f.W || cv.height !== f.H) { cv.width = f.W; cv.height = f.H; }
  cv.style.setProperty('--ar', `${f.W}/${f.H}`);
}
// 這張卡的距離：先看選的組別稱號，再看自己報名的組別
function cardCat() {
  const hit = Object.entries(titleByCat).find(([, t]) => t === F.title);
  return hit ? hit[0] : me?.cat;
}
const cardDist = () => DIST[cardCat()] || 0;
const cardRoute = () => routeJson?.[cardCat()]?.pts || myTrack || null;
// 路線畫進 box（等比例、置中），重點色線＋起終點
function drawRoute(pts, x0, y0, bw, bh, A) {
  const la0 = pts.reduce((a, p) => a + p[0], 0) / pts.length, k = Math.cos(la0 * Math.PI / 180);
  const xy = pts.map(([la, lo]) => [lo * k, -la]);
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const mnx = Math.min(...xs), mxx = Math.max(...xs), mny = Math.min(...ys), mxy = Math.max(...ys);
  const sc = Math.min(bw / ((mxx - mnx) || 1e-9), bh / ((mxy - mny) || 1e-9));
  const ox = x0 + (bw - (mxx - mnx) * sc) / 2, oy = y0 + (bh - (mxy - mny) * sc) / 2;
  const P = xy.map(([x, y]) => [ox + (x - mnx) * sc, oy + (y - mny) * sc]);
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const path = () => { ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); };
  path(); ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 14; ctx.stroke();
  path(); ctx.strokeStyle = A; ctx.lineWidth = 7; ctx.stroke();
  const dot = ([x, y], fill) => { ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#111'; ctx.stroke(); };
  dot(P[0], '#fff'); dot(P[P.length - 1], A);
  ctx.restore();
}
const fmtPace = s => `${Math.floor(s / 60)}'${String(Math.round(s % 60)).padStart(2, '0')}"`;
function draw() {
  sizeCanvas();
  const f = FORMATS[F.fmt], { W, H } = f, A = THEMES[F.theme] || THEMES.red, M = 72, B = H - f.bot, R = W - M;
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#1a1a1c'; ctx.fillRect(0, 0, W, H);
  if (photo.img) {
    const im = photo.img, base = Math.max(W / im.naturalWidth, H / im.naturalHeight) * photo.z;
    const w = im.naturalWidth * base, h = im.naturalHeight * base;
    photo.x = Math.max(Math.min(photo.x, (w - W) / 2), -(w - W) / 2); photo.y = Math.max(Math.min(photo.y, (h - H) / 2), -(h - H) / 2);
    ctx.drawImage(im, (W - w) / 2 + photo.x, (H - h) / 2 + photo.y, w, h);
  }
  // ── 先量好下方整組的高度，再鋪漸層
  const tt = F.time || '0:00:00', secs = parseHMS(tt), dist = cardDist();
  const tsz = fitFont(s => `italic 800 ${s}px ${COND}`, 330, 140, s => ctx.measureText(tt).width <= R - M + s * .04);
  const statY = B - 96, timeY = statY - 92, timeTop = timeY - tsz * .72;
  const catY = timeTop - 34, sub = !!F.sub, nameY = catY - (sub ? 118 : 70), subY = catY - 62;
  const nameSz = 92, fadeTop = nameY - nameSz - 260;
  let g = ctx.createLinearGradient(0, fadeTop, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.35, 'rgba(0,0,0,.5)'); g.addColorStop(.7, 'rgba(0,0,0,.78)'); g.addColorStop(1, 'rgba(0,0,0,.88)');
  ctx.fillStyle = g; ctx.fillRect(0, fadeTop, W, H - fadeTop);
  g = ctx.createLinearGradient(0, 0, 0, f.top + 230);
  g.addColorStop(0, 'rgba(0,0,0,.6)'); g.addColorStop(.6, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, f.top + 230);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const shadow = on => { ctx.shadowColor = on ? 'rgba(0,0,0,.4)' : 'transparent'; ctx.shadowBlur = on ? 16 : 0; ctx.shadowOffsetY = on ? 2 : 0; };
  // ── 右下：路線（放在名字右邊的深色區，不壓到人臉）
  const rpts = $('#in-route').checked ? cardRoute() : null, RB = F.fmt === 'post' ? 220 : 270;
  $('#route-row').hidden = !cardRoute();
  if (rpts && rpts.length > 1) drawRoute(rpts, R - RB, catY - 26 - RB, RB, RB, A);
  const LW = R - M, NW = (rpts ? R - RB - 36 : R) - M;
  // ── 上：英文小字（重點色）＋中文賽名
  shadow(true);
  let ty = f.top + 34;
  if (F.event) { const sz = fitFont(s => `700 ${s}px ${COND}`, 30, 18, s => spacedW(F.event.toUpperCase(), s * .2) <= LW); ctx.fillStyle = A; spaced(F.event.toUpperCase(), M, ty, sz * .2); ty += 66; }
  if (F.team) { const sz = fitFont(s => `900 ${s}px ${ZH}`, 52, 30, s => spacedW(F.team, s * .04) <= LW); ctx.fillStyle = '#fff'; spaced(F.team, M, ty, sz * .04); }
  // ── 名字＋號碼
  const bibTxt = F.bib ? '#' + String(F.bib).replace(/^#/, '') : '';
  ctx.font = `600 46px ${COND}`; const bw = bibTxt ? spacedW(bibTxt, 46 * .06) + 28 : 0;
  const nsz = fitFont(s => `900 ${s}px ${ZH}`, nameSz, 44, s => spacedW(F.name, s * .02) <= NW - bw);
  ctx.fillStyle = '#fff'; const nw = spaced(F.name, M, nameY, nsz * .02);
  if (bibTxt) { ctx.font = `600 46px ${COND}`; ctx.fillStyle = 'rgba(255,255,255,.72)'; spaced(bibTxt, M + nw + 28, nameY, 46 * .06); }
  if (sub) { ctx.font = `600 40px ${COND}`; ctx.fillStyle = 'rgba(255,255,255,.85)'; spaced(F.sub.toUpperCase(), M, subY, 40 * .1); }
  // ── 組別：重點色短槓＋字距拉開
  shadow(false);
  ctx.fillStyle = A; ctx.fillRect(M, catY - 30, 8, 32);
  const cat = F.title.toUpperCase();
  const csz = fitFont(s => `700 ${s}px ${COND}`, 38, 22, s => spacedW(cat, s * .16) <= R - M - 28);
  spaced(cat, M + 26, catY, csz * .16);
  // ── 成績（主角）
  shadow(true); ctx.fillStyle = '#fff'; ctx.font = `italic 800 ${tsz}px ${COND}`;
  ctx.fillText(tt, M - tsz * .03, timeY);
  shadow(false);
  // ── 數據列：配速／距離／日期
  const stats = [];
  if (secs && dist) stats.push(['PACE', fmtPace(secs / dist), '/KM']);
  if (dist) stats.push(['DISTANCE', String(dist), 'KM']);
  if (evDate) stats.push(['DATE', evDate, '']);
  const colW = (R - M) / 3;
  stats.forEach(([lab, val, unit], i) => {
    const x = M + colW * i;
    if (i) { ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(x - 24, statY - 82, 1.5, 92); }
    ctx.font = `600 24px ${COND}`; ctx.fillStyle = 'rgba(255,255,255,.6)'; spaced(lab, x, statY - 56, 24 * .22);
    ctx.font = `700 56px ${COND}`; ctx.fillStyle = '#fff'; const vw = spaced(val, x, statY, 56 * .02);
    if (unit) { ctx.font = `600 26px ${COND}`; ctx.fillStyle = 'rgba(255,255,255,.6)'; spaced(unit, x + vw + 8, statY, 26 * .1); }
  });
  // ── 底線＋品牌小字（左）＋hashtag（右）
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(M, B - 52, R - M, 1.5);
  let bx = M;
  BRAND.forEach(([en, zh], i) => {
    if (i) { ctx.font = `500 24px ${COND}`; ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillText('×', bx + 4, B); bx += 34; }
    ctx.font = `700 26px ${COND}`; ctx.fillStyle = 'rgba(255,255,255,.92)'; bx += spaced(en, bx, B, 26 * .14) + 12;
    ctx.font = `500 22px ${ZH}`; ctx.fillStyle = 'rgba(255,255,255,.7)'; bx += spaced(zh, bx, B, 22 * .12) + 18;
  });
  if (F.tag) { const sz = fitFont(s => `700 ${s}px ${ZH}`, 24, 16, s => spacedW(F.tag, s * .06) <= R - bx - 20); ctx.fillStyle = A; spaced(F.tag, R, B, sz * .06, 'right'); }
}
let fontReq = 0;
async function redraw() {
  const id = ++fontReq, txt = [F.name, F.bib, F.sub, F.title, F.time, F.team, F.event, F.tag, '0123456789:'].join('');
  const zh = txt + '形象美學采能行銷×';
  try { await Promise.all([document.fonts.load('900 80px "Noto Sans TC"', zh), document.fonts.load('500 24px "Noto Sans TC"', zh), document.fonts.load('700 24px "Noto Sans TC"', zh), document.fonts.load('italic 800 200px "Barlow Condensed"', '0123456789:'), document.fonts.load('700 40px "Barlow Condensed"', 'A'), document.fonts.load('600 40px "Barlow Condensed"', 'A'), document.fonts.load('500 24px "Barlow Condensed"', 'A')]); } catch { }
  if (id === fontReq) draw();
}

// ---------- 表單 ----------
function readForm() {
  F.name = $('#in-name').value.trim(); F.bib = $('#in-bib').value.trim(); F.sub = $('#in-sub').value.trim();
  const sel = $('#titles [aria-pressed=true]')?.dataset.title;
  F.title = sel === '__custom' ? ($('#in-title-custom').value.trim() || ' ') : (sel || TITLES[0]);
  F.team = $('#in-team').value.trim(); F.event = $('#in-event').value.trim(); F.tag = $('#in-tag').value.trim();
  F.theme = document.querySelector('input[name=theme]:checked')?.value || 'red';
  F.fmt = $('#fmts [aria-pressed=true]')?.dataset.fmt || 'story';
  const t = $('#in-time').value.trim(), s = parseHMS(t); F.time = s ? fmtHMS(s) : t;
  ls.set('card3', { name: F.name, bib: F.bib, sub: F.sub, title: F.title, team: F.team, event: F.event, tag: F.tag, theme: F.theme, fmt: F.fmt, time: F.time });
}
document.querySelector('.cwrap').addEventListener('input', ev => {
  if (['in-photo', 'in-photo2', 'in-zoom'].includes(ev.target.id)) return;
  readForm(); if (ev.target.id === 'in-time') setSrc(); redraw();
});
$('#fmts').querySelectorAll('[data-fmt]').forEach(x => x.setAttribute('aria-pressed', x.dataset.fmt === F.fmt));
$('#in-route').onchange = () => redraw();
$('#fmts').onclick = ev => {
  const b = ev.target.closest('[data-fmt]'); if (!b) return;
  $('#fmts').querySelectorAll('[data-fmt]').forEach(x => x.setAttribute('aria-pressed', x === b));
  readForm(); photo.x = 0; photo.y = 0; redraw();
};
$('#titles').onclick = ev => {
  const b = ev.target.closest('[data-title]'); if (!b) return;
  $('#titles').querySelectorAll('[data-title]').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#in-title-custom').hidden = b.dataset.title !== '__custom'; if (b.dataset.title === '__custom') $('#in-title-custom').focus();
  readForm(); redraw();
};
$('#in-time').addEventListener('change', () => {
  const s = parseHMS($('#in-time').value);
  if (!s && $('#in-time').value.trim()) return toast('分和秒不能超過 59');
  if (s) $('#in-time').value = fmtHMS(s);
  readForm(); setSrc(); redraw();
});
$('#btn-sync').onclick = async () => {
  const s = parseHMS($('#in-time').value); if (!s) return toast('先填完賽時間');
  try { me = await rpc('runlive_update', { p_token: token, p_patch: { finish_sec: s } }); ls.set('me', me); setSrc(); toast(`已存成正式成績 ${fmtHMS(s)}，名單也會更新`); }
  catch (e) { toast(e.code === 'bad_token' ? '登入失效，請回地圖頁重新登入' : '儲存失敗，稍後再試'); }
};

// ---------- 輸出 ----------
$('#btn-save').onclick = async () => {
  if (!photo.img) { toast('先選一張照片'); $('#in-photo').click(); return; }
  if (!parseHMS($('#in-time').value)) { toast('先填完賽時間'); $('#in-time').focus(); return; }
  readForm(); await redraw();
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .92));
  const name = `finisher_${F.bib || 'card'}.jpg`, file = new File([blob], name, { type: 'image/jpeg' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  $('#dlg-img').src = url; $('#dlg').showModal();
};
$('#dlg-close').onclick = () => $('#dlg').close();
bindTimeInput($('#in-time'), true);
readForm(); redraw();
</script>
