<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#111214">
<title>跑團 LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous">
<link rel="stylesheet" href="ui.css?v=9">
</head>
<body>

<div class="boot" id="boot"><div><div class="logo"><span class="pulse"></span>跑團 <b>LIVE</b></div><p>載入中…</p></div></div>

<div id="line-tip" class="line-tip" hidden>
  <span>在 LINE 裡開啟，定位和登入會跟手機瀏覽器分開。</span>
  <a id="line-open" class="btn sm light" href="#">用瀏覽器開</a>
</div>

<!-- 輸入團體代碼 -->
<section id="gate" class="hero" hidden>
  <div class="hero-in">
    <div class="logo"><span class="pulse"></span>跑團 <b>LIVE</b></div>
    <p class="hero-sub" id="gate-sub">&nbsp;</p>
    <form id="gate-form" class="hero-form">
      <label for="gate-code">團體代碼</label>
      <input id="gate-code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" required>
      <button class="btn primary block lg" type="submit">進入</button>
      <p class="hero-note">代碼在跑團群組裡，輸入一次就會記住。</p>
      <button type="button" class="btn ghost block" id="gate-switch" style="margin-top:18px;color:#fff;border-color:#ffffff40">換別場賽事</button>
    </form>
  </div>
</section>

<!-- 第一次進來：選身分、加入、換手機 -->
<section id="onboard" class="onboard" hidden></section>

<div id="app" class="app" hidden>
  <header class="top">
    <button type="button" class="evbtn" id="btn-event" aria-label="切換賽事"><span class="pulse"></span><span><small>跑團 LIVE</small><b id="ev-name">賽事</b></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
    <div class="race-clock" id="race-clock" aria-live="polite"></div>
    <span class="net" id="net" role="status"><i></i><span id="net-text"></span></span>
  </header>

  <main class="main">
    <section id="view-live" class="view live">
      <div class="map-wrap" id="map-wrap">
        <div id="map" role="region" aria-label="跑者地圖"></div>
        <div class="seg" id="filter" role="group" aria-label="組別"></div>
        <div class="map-btns">
          <button type="button" class="mbtn" id="btn-locate" aria-label="移到我的位置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" fill="none"/></svg></button>
          <button type="button" class="mbtn" id="btn-fit" aria-label="看全部的人"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button type="button" class="mbtn" id="btn-expand" aria-label="放大地圖" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
        </div>
        <div class="map-tip" id="map-tip" hidden>點一下路線，設成加油點</div>
        <div class="sel-card" id="sel-card" hidden></div>
      </div>
      <div class="list-wrap" id="list-wrap">
        <div class="list-head">
          <button type="button" class="cheer-btn" id="btn-cheer" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <span><small>看誰幾點到</small><b id="cheer-label">終點</b></span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <span class="counts" id="counts"></span>
        </div>
        <div id="list" class="list"></div>
      </div>
    </section>

    <section id="view-me" class="view scroll" hidden>
      <div class="pad"><div id="me"></div><div id="adm"></div></div>
    </section>
  </main>

  <div class="cta" id="cta" hidden></div>

  <nav class="tabs" aria-label="主選單">
    <button type="button" data-tab="live" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>即時</button>
    <button type="button" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>我</button>
    <a id="tab-card" href="card.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8 16h8M9 12.5h6"/><circle cx="12" cy="8" r="2"/></svg>圖卡</a>
  </nav>
</div>

<dialog id="dlg-confirm" class="dlg">
  <p id="dlg-msg"></p>
  <div class="row-end">
    <button class="btn ghost" id="dlg-no" type="button">取消</button>
    <button class="btn danger" id="dlg-yes" type="button">確定</button>
  </div>
</dialog>

<dialog id="dlg-sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-grip" aria-hidden="true"></div>
  <h2 id="sheet-title"></h2>
  <div id="sheet-body"></div>
  <button type="button" class="btn ghost block" id="sheet-close">關閉</button>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous"></script>
<script type="module" src="app.js?v=10"></script>
</body>
</html>
